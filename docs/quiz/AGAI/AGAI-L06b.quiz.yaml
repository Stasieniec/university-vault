        target: "Informational: belief"
      - id: e
        text: I'd like to keep my weekend free
        target: "Volitional: desire"
    why: >-
      Beliefs say what is the case and desires what the agent wants to be the
      case. The deliberative level holds what it is committed to doing, like going
      to the dentist for a toothache.

  - id: agai-gu487k
    status: retired
    type: single
    difficulty: medium
    level: apply
    topics: [BDI Model, LLM Agent]
    section: The BDI model
    prompt: >-
      A coding agent's goal is to free disk space, and it plans to delete a
      cache folder. In the BDI model, why must deliberating this intention look
      beyond the goal itself?
    options:
      - id: a
        text: Committing to the deletion brings side effects besides the goal
        correct: true
      - id: b
        text: Its beliefs about the disk might come from conflicting percepts
        why: Conflicting percepts are resolved by belief revision, a separate step from weighing the intention.
      - id: c
        text: The goal is a situation, while the plan is a conduct
        why: That categorial leap is real, but it concerns matching goals to plans. It does not explain why consequences need weighing.
    why: >-
      An intention includes side effects besides the intent, as going to the
      dentist brings the drill and the bill. An architecture without intention
      deliberation never weighs its possible choices.

  - id: agai-c6padq
    status: retired
    type: multi
    difficulty: hard
    level: apply
    topics: [BDI Model, Intent selection and plan selection]
    section: Intent selection and plan selection
    prompt: Which of these are plan selection, in Georgeff and Rao's sense?
    options:
      - id: a
        text: A robot vacuum with a low battery decides to recharge before cleaning
        why: Choosing which of two conflicting goals to advance first is intent selection.
      - id: b
        text: A courier, set on delivering a parcel, takes the stairs over the lift
        correct: true
      - id: c
        text: A robot weighs two sensors that disagree about the weather
        why: Resolving conflicting percepts into consistent beliefs is belief revision.
      - id: d
        text: A coding agent decides to fix the bug before writing the docs
        why: Prioritising one goal over another is intent selection.
      - id: e
        text: A robot vacuum, set on recharging, picks the wall route to its dock
        correct: true
    why: >-
      Intent selection prioritises which of several, possibly conflicting goals
      to advance. Plan selection then prioritises which of several plans for that
      intent to commit to.

  - id: agai-v4rc3h
    status: retired
    type: single
    difficulty: medium
    level: understand
    topics: [BDI Model, Intent selection and plan selection]
    section: Intent selection and plan selection
    prompt: Sileno flags a possible categorial leap between intent selection and plan selection. What is it?
    options:
      - id: a
        text: A goal may be about a situation, while a plan is a conduct
        correct: true
      - id: b
        text: Desires may conflict, while each intent has a single plan
        why: An intent can have several plans, and plan selection picks one of them.
      - id: c
        text: Goals come from beliefs, while plans come from desires
        why: Beliefs decide which plans are possible, and desires set preferences about both the intent and the plans.
    why: >-
      A goal can describe a state of the world, while a plan is a composite
      action. One fix is to read the goal as achieving that situation.

  - id: agai-cy8nwc
    status: retired
    type: single
    difficulty: easy
    level: apply
    topics: [BDI Model, Why it gets messy]
    section: Why it gets messy
    prompt: >-
      One weather service reports sun and another reports rain. In the full BDI
      picture, which process resolves the conflict?
    options:
      - id: a
        text: Intent selection
        why: Intent selection resolves conflicting desires into one intent.
      - id: b
        text: Plan selection
        why: Plan selection picks one of several alternative plans for an intent.
      - id: c
        text: Belief revision
        correct: true
      - id: d
        text: Attention allocation
        why: Attention allocation, in CAES, sets what the agent looks at. Conflicting percepts are resolved by belief revision.
    why: >-
      Percepts can conflict and must be resolved into consistent beliefs, the
      subject of belief revision and data fusion. In CAES this work belongs to
      expectations.

  - id: agai-guwsqg
    status: retired
    type: multi
    difficulty: medium
    level: understand
    topics: [CAES Model, BDI Model]
    section: "CAES: commitments, abilities, expectations, susceptibilities"
    prompt: Sileno's CAES model regroups the pieces of BDI. Which statements are true?
    options:
      - id: a
        text: Susceptibilities have no BDI counterpart
        correct: true
      - id: b
        text: Expectations take over desires and plans
        why: Expectations take over percepts and beliefs, what the agent knows about the world.
      - id: c
        text: Abilities take over beliefs and belief revision
        why: Abilities take over plans and plan selection, what the agent can achieve and how.
      - id: d
        text: Susceptibilities take over intentions
        why: Susceptibilities are new. The parts of an intention go to commitments (intent) and abilities (plans).
      - id: e
        text: Commitments take over desires and intent
        correct: true
    why: >-
      Commitments take over desires and intent, abilities plans, expectations
      percepts and beliefs. Susceptibilities, what the agent attends and responds
      to, are new.

  - id: agai-3fuvvt
    status: retired
    type: single
    difficulty: easy
    level: remember
    topics: [CAES Model]
    section: "CAES: commitments, abilities, expectations, susceptibilities"
    prompt: In Sileno's CAES model, what do susceptibilities cover?
    options:
      - id: a
        text: What the agent wants to achieve
        why: That is commitments, settled by intent selection.
      - id: b
        text: What the agent looks at, and how it responds
        correct: true
      - id: c
        text: What the agent can achieve, and how
        why: That is abilities, used in plan selection.
      - id: d
        text: What the agent knows about the world
        why: That is expectations, kept up by belief revision.
    why: >-
      Susceptibilities govern attention allocation: what the agent is looking at
      in the world and how it responds to it.

