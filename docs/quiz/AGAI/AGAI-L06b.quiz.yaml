      - id: a
        text: The exam is on Friday
        target: "Informational: belief"
      - id: b
        text: I want to pass the course
        target: "Volitional: desire"
      - id: c
        text: I'm studying in the library tonight
        target: "Deliberative: commitment"
      - id: d
