      - Evolutionary game theory
    pairs:
      - id: a
        text: Perfectly rational agents
        target: Classic game theory
      - id: b
        text: Bounded, possibly non-rational agents
        target: Evolutionary game theory
      - id: c
        text: A few agents, each different
        target: Classic game theory
      - id: d
        text: Strategies that spread by imitation
        target: Evolutionary game theory
      - id: e
        text: Agents that anticipate, decide, then act
        target: Classic game theory
    why: >-
      Classic game theory has few, different, perfectly rational agents who look
      ahead. Evolutionary game theory has many similar, boundedly rational agents
      whose strategies spread by copying.

  - id: agai-nfapxf
    status: retired
    type: truefalse
    difficulty: medium
    level: understand
    topics: [Agent-Based Modelling, BDI Model]
    section: Agent-based modelling
    statement: >-
      In agent-based modelling, programming BDI agents is a more expressive
      approach than cellular automata, in the same arena of rule-based behaviour.
    answer: true
    why: >-
      Both specify behaviour as rules. Cellular automata use if-then rules over
      the neighbours' states; BDI programs use rules over beliefs, desires and
      intentions.

