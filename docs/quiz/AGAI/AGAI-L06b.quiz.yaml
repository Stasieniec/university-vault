# Lecture 6b: Giovanni Sileno's guest lecture. Objects, events and actions,
# Dennett's stances, objects, actors and agents, Newell's minimal agent, weak
# agency, agent-based modelling, the theatrical view (EXEC, SELECT, MODIFY),
# Bratman and BDI, intent and plan selection, the CAES model applied to a coding
# agent, and AI agents against agentic AI.
# Source: the lecture note named below. Nothing here is keyed on the note's own
# worked answers (the weak-agency table, the EXEC/SELECT/MODIFY examples, the
# chatbot verdict), which the guest lecture left open.
course: AGAI
lecture: AGAI-L06b
title: "L06b What would make a chatbot an agent"
sort: 10
note: "AGAI-L06b - What Would Make a Chatbot an Agent"
questions:

  - id: agai-gbczaw
    status: retired
    type: cloze
    difficulty: easy
    level: remember
    topics: ["Objects, events and actions"]
    section: "Objects, events and actions"
    prompt: In Sileno's common-sense ontology, events are to time what ___ are to space.
    options:
      - id: a
        text: actions
        why: Actions are a kind of event, ones driven by agents, so they too occupy time.
      - id: b
        text: acts
        why: Acts are completed actions, which are events and so occupy time.
      - id: c
        text: objects
        correct: true
    why: >-
      Objects occupy a position in space and events occupy time. Events also
      involve objects, because they produce changes on them.

  - id: agai-u2t9kv
    status: retired
    type: single
    difficulty: easy
    level: apply
    topics: [Intentional Stance, "Dennett's stances"]
    section: "Dennett's stances"
    prompt: >-
      You buy a train ticket by pressing the buttons for your destination,
      knowing nothing about the machine's circuitry. Which of Dennett's stances
      are you taking?
    options:
      - id: a
        text: The physical stance
        why: You use no physical laws. You rely on what the machine is supposed to do.
      - id: b
        text: The design stance
        correct: true
      - id: c
        text: The intentional stance
        why: You ascribe the machine no beliefs or desires, only a designed function.
    why: >-
      The design stance predicts an entity from what it was designed to do. You
      read the time off a clock the same way, without knowing its mechanism.

  - id: agai-b9mrrp
    status: retired
    type: single
    difficulty: medium
    level: apply
    topics: [Intentional Stance, "Dennett's stances"]
    section: "Dennett's stances"
    prompt: >-
      A ticket machine jams on a bent coin, and its buttons no longer do what
      they were designed to do. On Dennett's account, which stance now explains
      its behaviour?
    options:
      - id: a
        text: The physical stance
        correct: true
      - id: b
        text: The design stance
        why: Design-stance predictions hold only while the machine works. Once it breaks they fail, as with a broken clock.
      - id: c
        text: The intentional stance
        why: Ascribing it a wish to keep your coin adds nothing. The jam has a physical cause.
    why: >-
      When something breaks, design-stance predictions fail and only the physical
      stance explains what it does, as with a broken clock.

  - id: agai-ptvsz9
    status: retired
    type: multi
    difficulty: easy
    level: apply
    topics: [Intentional Stance, "Dennett's stances"]
    section: "Dennett's stances"
    prompt: Which of these involve taking Dennett's intentional stance?
    options:
      - id: a
        text: Reading a cat's flattened ears as "I'm scared"
        correct: true
      - id: b
        text: Saying that the EU fears a trade war
        correct: true
      - id: c
        text: Predicting where a billiard ball goes from the cue's strike
        why: That uses physical laws, which is the physical stance.
      - id: d
        text: Reading the time off a station clock
        why: That relies on what the clock was designed to do, which is the design stance.
      - id: e
        text: Explaining a stopped watch by its broken spring
        why: A breakdown is explained by the physical stance, since the design no longer predicts anything.
      - id: f
        text: Expecting a child to look for her toy where she saw it hidden
        correct: true
    why: >-
      The intentional stance ascribes beliefs, desires and intentions, plus enough
      rationality to act on them. We take it towards children, animals and whole
      countries alike.

  - id: agai-sae7qv
    status: retired
    type: single
    difficulty: medium
    level: apply
    topics: [Intentional Stance, "Objects, actors and agents"]
    section: "Objects, actors and agents"
    prompt: >-
      Villagers say the river floods each spring because it is angry with
      them. In Sileno's ontology, what are they treating the river as?
    options:
      - id: a
        text: An actor
        why: A flooding river is an actor anyway, since it produces changes. Ascribing anger to it makes it an agent.
      - id: b
        text: An object
        why: Objects only undergo changes caused by others. A flooding river produces them.
      - id: c
        text: An event
        why: The flood is an event. The river is the entity the villagers ascribe intentions to.
      - id: d
        text: An agent
        correct: true
    why: >-
      Agents are actors ascribed with intentions. A flooding river is an actor; a
      river that floods out of anger, like a volcano's angry fire spirit, is an
      agent.

  - id: agai-pd42dq
    status: retired
    type: multi
    difficulty: medium
    level: remember
    topics: [Intelligent Agent, What intentions are in an artificial agent]
    section: What intentions are in an artificial agent
    prompt: Which belong to Allen Newell's minimal structure of an agent at the knowledge level?
    options:
      - id: a
        text: A body of knowledge that works like a memory
        correct: true
      - id: b
        text: A set of goals kept apart from its other knowledge
        correct: true
      - id: c
        text: A repertoire of scripts to select from
        why: Scripts and repertoires come from Sileno's theatrical view of agency.
      - id: d
        text: Intentions settled by weighing its choices
        why: Settled intentions come from Bratman and the BDI model. Newell's structure has goals.
      - id: e
        text: A physical body to act with and be acted upon
        correct: true
    why: >-
      Newell's agent has a body, a body of knowledge like a memory, and a set of
      goals. The goals enter its behaviour in a distinct way, as what it strives
      to realise.

  - id: agai-d3ramz
    status: retired
    type: cloze
    difficulty: easy
    level: remember
    topics: [Intelligent Agent, What intentions are in an artificial agent]
    section: What intentions are in an artificial agent
    prompt: >-
      In Sileno's minimal intelligent agent, the mind depends on memory and
      purpose. Functionally, memory maps at least to ___.
    options:
      - id: a
        text: desires
        why: Desires are what purpose maps to.
      - id: b
        text: beliefs
        correct: true
      - id: c
        text: intentions
        why: Intentions are the extra state Bratman argues beliefs and desires leave out.
      - id: d
        text: abilities
        why: Abilities are a CAES component, what the agent can achieve and how.
    why: >-
      Memory maps at least to beliefs and purpose to desires. Whether beliefs and
      desires are enough is the question Bratman's argument about intentions
      answers.

  - id: agai-qqpz4a
    status: retired
    type: single
    difficulty: hard
    level: apply
    topics: [Rational Agent, Intelligent Agent]
    section: What intentions are in an artificial agent
    prompt: >-
      A cyclist swerves around a pothole at exactly the right moment but cannot
      say why she chose that line. On Sileno's distinction, what does the swerve
      show?
    options:
      - id: a
        text: Rationality, since the swerve serves her goals
        why: For Sileno, rationality refers to explicit reasons weighed in a decision, and she weighed none she can state.
      - id: b
        text: Neither, since she had no explicit purpose
        why: Purpose can be implicit in Sileno's minimal agent. Doing the correct action is what intelligence asks.
      - id: c
        text: Intelligence, which needs no verbalised reasons
        correct: true
    why: >-
      Sileno ties rationality to explicit reasons weighed in a decision.
      Intelligence, executing the correct action in a situation, generalises it
      and needs no verbalisation.

  - id: agai-jyr4mt
    status: retired
    type: single
    difficulty: medium
    level: understand
    topics: [Intelligent Agent, "Which things are agents?"]
    section: "Which things are agents?"
    prompt: Wooldridge and Jennings list four characteristics of weak agency. Which behaviour shows proactivity?
    options:
      - id: a
        text: Taking initiative towards a goal it holds
        correct: true
      - id: b
        text: Flinching away the moment something touches it
        why: That is a response to a change in the environment, which is reactivity.
      - id: c
        text: Running for weeks with no one stepping in
        why: That is autonomy, operating without continuous external intervention.
      - id: d
        text: Negotiating a delivery slot with another agent
        why: That is social ability, interacting with other agents to coordinate, compete or negotiate.
    why: >-
      Proactivity is initiative driven by goals or intentions, as opposed to a
      simple input-output mapping from what happens to what it does.

  - id: agai-b6j3dd
    status: retired
    type: match
    difficulty: medium
    level: understand
