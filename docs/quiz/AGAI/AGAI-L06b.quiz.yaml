  - id: agai-fz5xjc
    status: retired
    type: order
    difficulty: medium
    level: remember
    topics: [CAES Model, Applying CAES to a coding agent]
    section: Applying CAES to a coding agent
    prompt: A test fails in Sileno's CAES picture of a coding agent. Put the steps of its problem-solving cycle in order.
    items:
      - id: a
        text: The failure is received and routed (susceptibilities)
      - id: b
        text: The context is updated (expectations)
      - id: c
        text: Repairing the bug becomes the goal (commitments)
      - id: d
        text: A debugging skill is chosen (abilities)
    why: >-
      What comes in passes through susceptibilities and is integrated into
      expectations. Knowing the problem, the agent commits to a repair, and plan
      selection then picks an ability for that intent.

