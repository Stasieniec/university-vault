  - id: agai-7bpvbf
    status: retired
    type: single
    difficulty: medium
    level: apply
    topics: [Agent Program, "A layered view of action, including learning"]
    section: "A layered view of action, including learning"
    prompt: >-
      An assistant's scripts are a fixed set of reply strategies: none is ever
      added or rewritten. From the effects of its replies, it learns which
      strategy is most effective and uses it more often. At which level is it
      learning, in Sileno's view?
    options:
      - id: a
        text: The MODIFY level
        why: Learning at the MODIFY level creates or rewrites scripts, and no strategy here is added or rewritten.
      - id: b
        text: The EXEC level
        why: EXEC performs a script. Learning is feedback from its effects to SELECT or MODIFY.
      - id: c
        text: The SELECT level
        correct: true
    why: >-
      Learning at the SELECT level asks which available script is most effective.
      Learning at the MODIFY level asks how to create or rewrite a script, which
      never happens here.

  - id: agai-6d5spe
    status: retired
    type: single
    difficulty: hard
    level: apply
    topics: [BDI Model, "Bratman's chocolate"]
    section: "Bratman's chocolate"
    prompt: >-
      A student feels a sudden strong urge to skip class and judges it will keep
      her at home. Then she recalls her study plan and goes. What would Bratman
      say about the urge?
    options:
      - id: a
        text: She intended to skip, then gave that intention up
        why: That is the desire-belief reading, which Bratman rejects. A fleeting predominant desire with a belief is no intention.
      - id: b
        text: She never intended to skip, as she was never settled on it
        correct: true
      - id: c
        text: She intended both, and her study plan won
        why: Her study plan was the settled commitment. The urge was only a desire.
      - id: d
        text: She felt no real desire to skip, only a passing thought
        why: The urge was a real, briefly predominant desire. What she lacked was being settled on it.
    why: >-
      For Bratman, intention is being settled on a course of action. A fleeting
      predominant desire plus a belief that it will lead to action falls short,
      and earlier plans can override it.

  - id: agai-vj2q78
    status: retired
    type: truefalse
    difficulty: medium
    level: understand
    topics: [BDI Model, "Bratman's chocolate"]
    section: "Bratman's chocolate"
    statement: Bratman holds that an intention is a predominant desire together with a belief that the desire will lead to action.
    answer: false
    why: >-
      That is the desire-belief account, which Bratman rejects. For him intention
      is a distinct state: being settled on a course of action.

  - id: agai-p57yxr
    status: retired
