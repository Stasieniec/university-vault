# (stateless Q-learning in the Stag Hunt, tabular Q-learning and PPO in the
# Coin Game) do and why the results come out as they do; nothing to run or
# compute. Source: the lab note named below.
course: AGAI
lecture: AGAI-Lab02
title: "Lab 2 Learning agents"
sort: 6
