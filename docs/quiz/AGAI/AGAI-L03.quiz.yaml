  - id: agai-76s4hd
    type: single
    difficulty: easy
    level: remember
    topics: [Independent Learning]
    section: "Independent learning: treat everyone else as environment"
    prompt: In independent Q-learning, how does each agent handle the other agents?
    options:
      - id: a
        text: It learns an explicit model of their policies
        why: That is agent modelling, a multi-agent-aware method. IQL agents do not model each other.
      - id: b
        text: A central learner chooses everyone's actions
        why: That is centralized learning, the other naive way to reuse single-agent RL.
      - id: c
        text: It copies their policy, so all agents share one
        why: Sharing one policy is a different technique. Each IQL agent keeps its own table.
      - id: d
        text: It treats them as part of the environment
        correct: true
    why: >-
      Each agent runs ordinary Q-learning on its own actions and rewards. The
      others' changing behaviour is absorbed into the transitions and rewards it
      experiences, so its MDP is not fixed.
