  - id: agai-x68kjr
    type: truefalse
    difficulty: medium
    level: understand
    topics: [Prisoner's Dilemma, Nash Equilibrium]
    section: "Cooperation: the Prisoner's Dilemma"
    statement: In the Prisoner's Dilemma, both agents prefer mutual cooperation to the outcome that rational agents reach.
    answer: true
    why: >-
      Defection dominates, so rational agents reach (D, D), the only Nash
      equilibrium, with 1 each. Both would rather have (C, C) with 3 each:
      individual rationality and the group's interest come apart.

  - id: agai-pp4kpf
    type: single
    difficulty: hard
    level: apply
    topics: [Prisoner's Dilemma]
    section: "Cooperation: the Prisoner's Dilemma"
    prompt: >-
      In the one-shot Prisoner's Dilemma (C,C = 3,3; C,D = 0,5; D,C = 5,0;
      D,D = 1,1), an agent is certain its partner will cooperate. What does a
      self-interested agent do?
    options:
      - id: a
        text: Cooperate, since certainty makes (C, C) reachable
        why: Reaching (C, C) needs this agent to give up 2 points. Certainty about the partner does not change that.
      - id: b
        text: Cooperate, since the best reply copies the partner
        why: Copying the partner is the Stag Hunt's best reply. In the Prisoner's Dilemma, D is best against C.
      - id: c
        text: Defect, since 5 against a cooperator beats 3
        correct: true
      - id: d
        text: Randomise, since neither action is better for sure
        why: D is better for sure. It pays more whatever the partner does.
    why: >-
      Against a cooperator, defecting earns 5 and cooperating 3. D dominates C, so
      even trust in the partner does not make cooperation the self-interested
      choice.

  - id: agai-tdcxc4
    type: multi
    difficulty: hard
    level: analyze
    topics: [Stag Hunt, Nash Equilibrium]
    section: "Coordination: the Stag Hunt"
    prompt: In the Stag Hunt (C,C = 4,4; C,D = 0,3; D,C = 3,0; D,D = 2,2), which statements are true?
    options:
      - id: a
        text: (C, C) is a Nash equilibrium
        correct: true
      - id: b
        text: D dominates C, as in the Prisoner's Dilemma
        why: Against C, playing C pays more (4 against 3). The best reply depends on the partner, so nothing dominates.
      - id: c
        text: (D, D) is a Nash equilibrium
        correct: true
      - id: d
        text: Game theory alone predicts that agents reach (C, C)
        why: Both equilibria are possible. Game theory alone does not say which one agents reach.
      - id: e
        text: Cooperating is risky, since alone it earns 0
        correct: true
    why: >-
      The best reply copies the partner, so (C, C) and (D, D) are both
      equilibria. (C, C) is better for both, but D guarantees at least 2 while a
      lone cooperator gets 0.

  - id: agai-utd3uu
    type: single
    difficulty: hard
    level: analyze
    topics: [Stag Hunt, Replicator Dynamics]
    section: "Populations: who spreads?"
    prompt: >-
      A large population plays the Stag Hunt (C,C = 4,4; C,D = 0,3; D,C = 3,0;
      D,D = 2,2),
      half C agents and half D agents, meeting at random. Strategies that earn
      more spread. Why do C agents decline?
    options:
      - id: a
        text: D dominates C, so D agents earn more against everyone
        why: D does not dominate in the Stag Hunt. Against a C partner, C earns more.
      - id: b
        text: (D, D) is the only equilibrium of the Stag Hunt
        why: (C, C) is an equilibrium too. The decline comes from average payoffs at this mix.
      - id: c
        text: D agents exploit C agents for 5 points each time
        why: That is the Prisoner's Dilemma. In the Stag Hunt a defector against a cooperator gets 3.
      - id: d
        text: At this mix, D earns 2.5 on average and C earns 2
        correct: true
    why: >-
      With half the partners cooperating, D averages 2.5 and C only 2, so D
      spreads. C earns 0.5 × 4 + 0.5 × 0 and D earns 0.5 × 3 + 0.5 × 2.
      Cooperation pays only once more than two thirds already cooperate.

  - id: agai-mgnuyz
    type: truefalse
    difficulty: medium
    level: understand
    topics: [Reward Hacking]
    section: "Reward misalignment: the vacuum world"
    statement: With only Left, Right and Suck, rewarding clean squares and rewarding dirt sucked produce different vacuum behaviour.
    answer: false
    why: >-
      Both rewards give the same behaviour, suck when dirty and move otherwise, so
      testing cannot tell them apart. Only once Dump is added does the
      dirt-sucked reward dump and re-suck forever.

  - id: agai-7bh95z
    type: single
    difficulty: hard
    level: apply
    topics: [Reward Hacking, Rational Agent]
    section: "Reward misalignment: the vacuum world"
    prompt: >-
      A support agent earns +1 per ticket it closes. After an update lets it
      reopen tickets, it closes and reopens the same ticket over and over. Which
      design rule was broken?
    options:
      - id: a
        text: Penalise every new action until it has been tested
        why: No such rule exists. Rewarding the wanted outcome would make reopening worthless without any penalty.
      - id: b
        text: Reward solved problems, the outcome actually wanted
        correct: true
      - id: c
        text: Give the agent a utility function in place of a goal
        why: The agent already maximises a numeric reward. The trouble is what that reward measures.
      - id: d
        text: Let the agent keep an internal model of the world
        why: A better model would only make it better at farming the reward.
    why: >-
      Russell and Norvig: design performance measures by what you want achieved in
      the environment, not by how you think the agent should behave. Like the
      vacuum that dumps and re-sucks, this agent farms the behaviour that is paid.
